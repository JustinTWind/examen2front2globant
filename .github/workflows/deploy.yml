name: Deploy to GitHub Pages

on:
  # Se ejecuta automáticamente cada vez que haces un push a la rama 'main'
  push:
    branches: ["main"]
  # Te permite ejecutar el despliegue manualmente desde la pestaña de Actions
  workflow_dispatch:

# Otorga los permisos estrictamente necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se solapen múltiples despliegues al mismo tiempo
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Subir artefacto (Tus archivos web)
        uses: actions/upload-pages-artifact@v3
        with:
          # Define qué carpeta se va a subir. 
          # '.' significa que subirá todo el repositorio base.
          path: '.'
          
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4